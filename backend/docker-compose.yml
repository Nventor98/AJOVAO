services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: naijalife
      POSTGRES_USER: naijalife
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naijalife -d naijalife"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NAIJALIFE_APP_ENV: development
      NAIJALIFE_SECRET_KEY: local-development-secret-change-before-deployment
      NAIJALIFE_DATABASE_URL: postgresql+psycopg://naijalife:local-dev-only@db:5432/naijalife
      NAIJALIFE_REDIS_URL: redis://redis:6379/0
      NAIJALIFE_JOB_BACKEND: ${NAIJALIFE_JOB_BACKEND:-inline}
      NAIJALIFE_TRUSTED_PROXIES: '["127.0.0.1","::1"]'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - app.shared.celery_app:celery_app
      - worker
      - --loglevel=INFO
    profiles:
      - celery
    environment:
      NAIJALIFE_APP_ENV: development
      NAIJALIFE_SECRET_KEY: local-development-secret-change-before-deployment
      NAIJALIFE_DATABASE_URL: postgresql+psycopg://naijalife:local-dev-only@db:5432/naijalife
      NAIJALIFE_REDIS_URL: redis://redis:6379/0
      NAIJALIFE_JOB_BACKEND: celery
      NAIJALIFE_TRUSTED_PROXIES: '["127.0.0.1","::1"]'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
